[general]
# Only platforms proven to work live belong here. The other seven plugins have
# never been run against a real board; they stay on disk but out of the run
# until each earns its way back in.
enabled_plugins = ["linkedin"]

[search]
keywords  = [
  "Senior Backend Engineer", "SDE 2", "SDE 3",
  "Staff Engineer", "Lead Backend Engineer", "Senior Software Engineer"
]
locations = ["Pune", "Bengaluru", "Hyderabad", "India"]

[poll]
# 24-hour sweep, once a day. This replaces the earlier 30-minute / 60-minute
# Strategy 1 loop by explicit decision: the action is now recruiter outreach on
# jobs where LinkedIn ranks Yash a top applicant, and that ranking needs a
# populated applicant pool to exist at all — which a minutes-old posting does
# not have.
interval_minutes = 1440
window_seconds   = 86400
active_start_ist = 8
active_end_ist   = 22

[limits]
apply_attempts_per_run = 5
# LinkedIn pages job search 25 at a time. 8 pages = up to 200 postings per
# location, which comfortably covers a 24-hour window; the scraper stops early
# on the first page that returns nothing new, so this is a ceiling, not a cost.
max_pages_per_location = 8

[filter]
min_ctc_lpa    = 38.0
target_yoe     = 5
full_time_only = true
titles = [
  "SDE 2", "SDE 3",
  "Senior Software Engineer", "Senior Backend Engineer",
  "Lead Engineer", "Staff Engineer"
]

[schedule]
brief_poll_cron = "30 15 * * *"   # 9:00 PM IST = 15:30 UTC

[paths]
resume_pdf = "config/resume.pdf"
resume_dir = "~/Desktop/cognizant/interview/resumes"

[runtime]
timezone = "Asia/Kolkata"

[notify]
digest_recipient = "yashdeshmukh7@gmail.com"
smtp_host        = "smtp.gmail.com"
smtp_port        = 587

[funding]
# Strategy 3: newly funded startups hire before they post. Free RSS; no
# Crunchbase API.
enabled = true
feeds = [
  "https://inc42.com/feed/",
  "https://entrackr.com/feed/"
]
